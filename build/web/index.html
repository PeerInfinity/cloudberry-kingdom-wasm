<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cloudberry Kingdom engine-only (browser)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #ccc; font: 12px monospace; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    /* The drawing buffer stays 1280x720; CSS scales it to the window so the arrow keys and Space never scroll the page. */
    canvas { display: block; width: min(100vw, calc((100vh - 2em) * 16 / 9)); aspect-ratio: 16 / 9; outline: none; }
    #keys { height: 2em; line-height: 2em; white-space: nowrap; overflow: hidden; }
  </style>
</head>
<body>
  <canvas id="canvas" width="1280" height="720" tabindex="-1"></canvas>
  <div id="keys">Menus: arrows (or W S) choose, Enter or Space confirm, Esc back &middot; Level: &larr; &rarr; / A D run, &uarr; / W jump, Esc pause, Enter power-ups, Space restart from the door</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
